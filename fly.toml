# fly config for the always-on faff L3 runner.
#
# No [http_service]: this is an outbound-only runner (it talks to GitHub and the
# model API, nothing inbound), so there is nothing to auto-stop on idle. The Machine
# stays up until you destroy it, which is what "always on" needs.
#
# Deploy (see README): launch the app, set the secrets, then start ONE standalone
# Machine with `fly machine run`. Do not use `fly deploy`, whose release-health wait
# can recreate a slow-booting Machine in a restart loop.

app = "fly-ci-l3-runner"
primary_region = "yyz"   # Toronto — nearest available fly region to Ottawa (fly has no Montreal/Ottawa)

[build]
  dockerfile = "Dockerfile"

# The Machine's docker engine stores images + per-drain container copies here. It runs on
# the vfs driver (a microVM has no kernel overlay), which is space-hungry, so /var/lib/docker
# lives on a volume rather than the ~8GB ephemeral rootfs. This also persists the built cage
# image across Machine restarts, so only the first boot pays the cage-build cost.
[mounts]
  source = "faff_docker"
  destination = "/var/lib/docker"

# dockerd on vfs duplicates image layers, so give it headroom. performance-4x (dedicated
# CPUs) after shared-cpu-4x starved the cage build / drains; dedicated cores also lift drain
# throughput. Memory is 8192 because fly enforces >= 2GB per dedicated core (4 cores -> 8192
# floor); 4096 is rejected on performance sizes. Bump further if a drain is still starved.
[[vm]]
  size   = "performance-4x"
  memory = "8192"
  cpus   = 4
